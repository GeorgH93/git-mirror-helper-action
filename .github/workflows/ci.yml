name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint action metadata
        uses: rhysd/actionlint@v1

      - name: Syntax check
        run: |
          node --check index.js
          node --check cleanup.js
          node --check test/smoke-test.js
          node --check test/runner.js

      - name: Smoke tests
        run: node test/smoke-test.js
