name: "Git Mirror Helper"
description: "Fetch mirrors from an organization and set up git url rewrite rules"
author: "GeorgH93"
inputs:
  server:
    description: "Base URL of your git server"
    required: true
  org:
    description: "Organization name in your git server"
    required: true
  api_token:
    description: "API token for Gitea"
    required: false
    secret: true
  use_include:
    description: "Write rewrites to a separate include file instead of global config"
    required: false
    default: "true"
  output_file:
    description: "Custom path for the mirror list file (only used when use_include is true)"
    required: false
  if_file_exists:
    description: "What to do when the mirror list file already exists: skip, fail, append, overwrite_keep_on_cleanup, overwrite_restore_on_cleanup or overwrite_delete_on_cleanup (only used when use_include is true)"
    required: false
    default: "append"
outputs:
  git-mirror-list-file:
    description: "Path to the mirror list file"
runs:
  using: "node24"
  main: "index.js"
  post: "cleanup.js"
branding:
  icon: "git-branch"
  color: "blue"
